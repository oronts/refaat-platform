site_name: Refaat
site_description: Retrieval & Evidence Foundation for Adaptive Agentic Tooling
site_url: https://oronts.github.io/refaat/
repo_url: https://github.com/oronts/refaat
repo_name: oronts/refaat
copyright: Copyright &copy; 2026 Oronts
strict: true
theme:
  name: material
  features:
    - navigation.sections
    - navigation.instant
    - navigation.top
    - content.code.copy
    - content.tabs.link
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
