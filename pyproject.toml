[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "refaat"
version = "0.1.0"
description = "Retrieval and evidence foundation for adaptive agentic tooling."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Oronts", email = "office@oronts.com" }]
keywords = [
  "rag",
  "graphrag",
  "cag",
  "kag",
  "agents",
  "fastapi",
  "llm",
  "retrieval",
  "evidence",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "orjson>=3.10,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.18,<1",
  "sqlalchemy>=2.0.36,<3",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
postgres = ["pgvector>=0.3.6,<1", "psycopg[binary]>=3.2,<4"]
opensearch = ["opensearch-py>=2,<4"]
redis = ["redis>=5.2,<9"]
s3 = ["boto3>=1.35,<2"]
documents = ["beautifulsoup4>=4.12,<5", "pypdf>=5.1,<7", "python-docx>=1.1,<2"]
media = ["faster-whisper>=1.1,<2", "pillow>=11,<13", "pytesseract>=0.3.13,<1"]
otel = [
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.29,<2",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
  "opentelemetry-instrumentation-httpx>=0.50b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.50b0,<1",
  "opentelemetry-sdk>=1.29,<2",
]
integrations = ["langchain-core>=0.3,<2", "llama-index-core>=0.12,<1"]
mcp = ["mcp>=1.0,<3"]
server = [
  "beautifulsoup4>=4.12,<5",
  "boto3>=1.35,<2",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.29,<2",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
  "opentelemetry-instrumentation-httpx>=0.50b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.50b0,<1",
  "opentelemetry-sdk>=1.29,<2",
  "pgvector>=0.3.6,<1",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=5.1,<7",
  "python-docx>=1.1,<2",
  "redis>=5.2,<9",
]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.6,<8",
  "jsonschema>=4.23,<5",
  "langgraph>=1.0.10,<2",
  "mypy>=1.13,<3",
  "pip-audit>=2.7,<3",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "pyyaml>=6,<7",
  "reportlab>=4.2,<6",
  "ruff>=0.9,<1",
]
docs = ["mkdocs-material>=9.6,<10"]

[project.urls]
Homepage = "https://oronts.com"
Documentation = "https://github.com/oronts/refaat"
Issues = "https://github.com/oronts/refaat/issues"
Source = "https://github.com/oronts/refaat"

[project.scripts]
refaat = "refaat.cli:app"
refaat-api = "refaat.api.app:run"
refaat-worker = "refaat.worker:run"

[project.entry-points."refaat.skills"]
corpus_health = "refaat.skills.builtin:CorpusHealthSkill"

# Third-party packages may publish these groups. They are intentionally empty here.
[project.entry-points."refaat.extractors"]

[project.entry-points."refaat.connectors"]

[project.entry-points."refaat.event_sinks"]

[tool.uv]
# Security floors for dependencies: nltk before 3.10.3 (pulled by llama-index-core) carries
# PYSEC-2026-3733 through 3741, fixed in 3.10.3 except PYSEC-2026-3740 (an nltk pathsec model-persistence
# bypass with no patched release yet, not reachable in Refaat and accepted with an expiry in
# docs/reference/vuln-allowlist.json); pypdf before 6.16.1 carries CVE-2026-84309 through 84311, fixed in 6.16.1.
constraint-dependencies = ["nltk>=3.10.3,<4", "pypdf>=6.16.1,<7"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["refaat*"]

[tool.setuptools.package-data]
refaat = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]
exclude = ["migrations/versions", ".venv", "venv"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PIE", "PT", "RUF", "S", "SIM", "UP"]
ignore = ["S101", "S104", "S105", "S106", "S107", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S108"]
"migrations/**/*.py" = ["E501"]
"scripts/**/*.py" = ["S314", "S506", "S603", "S607"]
"examples/**/*.py" = ["S603"]

[tool.ruff.lint.isort]
known-first-party = ["refaat"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["refaat"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "boto3.*",
  "botocore.*",
  "bs4.*",
  "docx.*",
  "faster_whisper.*",
  "langchain_core.*",
  "langgraph.*",
  "llama_index.*",
  "mcp.*",
  "opensearchpy.*",
  "pgvector.*",
  "psycopg.*",
  "pypdf.*",
  "pytesseract.*",
  "redis.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: crosses application and persistence boundaries",
  "e2e: exercises a public API, SDK, CLI, or worker surface",
  "postgres: requires a PostgreSQL/pgvector service",
]

[tool.coverage.run]
branch = true
source = ["refaat"]
omit = ["src/refaat/infrastructure/media.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
